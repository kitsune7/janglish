<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Janglish recording</title>
    <meta name="janglish-api" content="https://janglish-recordings.janglish.workers.dev" />
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <h1>Janglish recording</h1>
    <p id="greeting"></p>

    <div id="app" hidden>
      <div id="progress"></div>
      <div id="sentence"></div>
      <div id="furigana-status" aria-live="polite"></div>

      <div class="controls">
        <button id="record" class="primary">● Record</button>
        <button id="stop" class="danger" disabled>■ Stop</button>
        <button id="play" disabled>▶ Play</button>
        <button id="upload" disabled>↑ Upload</button>
      </div>
      <div class="controls">
        <button id="prev">← Prev</button>
        <button id="next">Next →</button>
      </div>

      <audio id="player" controls preload="none"></audio>
      <div id="status"></div>

      <div id="completed-banner" hidden>All sentences uploaded. Thank you! You can close this tab.</div>
    </div>

    <div id="fatal" hidden></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
